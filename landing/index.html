<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tally Homeschool</title>
  <meta name="description" content="Tally Homeschool: less logging, more learning.">
  <link rel="icon" href="tally-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #1B2540; color: #EEF1F6; font-family: Inter, system-ui, sans-serif; text-align: center; }
    main { padding: 24px 16px; max-width: 480px; }
    img { width: 160px; height: auto; }
    h1 { font-size: 1.6rem; margin: 24px 0 8px; }
    p { color: #C9CFDC; line-height: 1.5; }
    a { display: inline-block; margin-top: 16px; padding: 12px 24px; border-radius: 10px;
        background: #E2672F; color: #fff; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <img src="tally-logo.png" alt="tally">
    <h1>Less logging, more learning.</h1>
    <p>Tally keeps your homeschool's assignments, grades and records in one place, so you can spend your time teaching.</p>
    <a href="https://tally-homeschool.streamlit.app">Open the app</a>
  </main>
</body>
</html>
